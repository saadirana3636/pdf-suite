<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PDF Suite Ultimate Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            background: radial-gradient(circle at 50% 10%, #0d1527 0%, #060913 100%);
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            color: #f8fafc;
            min-height: 100vh;
            user-select: none;
        }
        .glass-panel {
            background: rgba(18, 26, 43, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .glow-btn {
            background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
            box-shadow: 0 8px 24px -4px rgba(37, 99, 235, 0.5);
            transition: all 0.2s ease;
        }
        .glow-btn:active { transform: scale(0.97); }
        .tab-active { color: #38bdf8; position: relative; }
        .tab-active::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 5px;
            height: 5px;
            background: #38bdf8;
            border-radius: 50%;
            box-shadow: 0 0 10px #38bdf8;
        }
    </style>
</head>
<body class="flex items-center justify-center p-2 md:p-6">
    <div class="w-full max-w-[430px] min-h-[850px] glass-panel rounded-[40px] border-2 border-white/15 flex flex-col overflow-hidden relative shadow-2xl">
        
        <!-- Header -->
        <header class="flex justify-between items-center px-6 pt-5 pb-3 border-b border-white/5">
            <div>
                <h1 class="text-lg font-bold tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">PDF Suite Ultimate</h1>
                <p class="text-[10px] text-emerald-400 font-medium">● Complete Offline Pro Studio</p>
            </div>
            <div class="w-8 h-8 rounded-full bg-white/5 border border-white/10 flex items-center justify-center text-xs">•••</div>
        </header>

        <!-- Main Dynamic Screen -->
        <main class="flex-1 overflow-y-auto px-5 py-4 space-y-4" id="screenContainer"></main>

        <!-- Bottom Tabs -->
        <nav class="glass-panel border-t border-white/10 py-3 px-6 flex justify-between items-center text-slate-400 text-[11px] font-medium">
            <button onclick="navigate('home', event)" class="tab-item flex flex-col items-center gap-1 tab-active" id="tab-home"><span class="text-lg">🏠</span><span>Home</span></button>
            <button onclick="navigate('crop', event)" class="tab-item flex flex-col items-center gap-1" id="tab-crop"><span class="text-lg">✂️</span><span>Crop</span></button>
            <button onclick="navigate('editor', event)" class="tab-item flex flex-col items-center gap-1" id="tab-editor"><span class="text-lg">✍️</span><span>Editor</span></button>
            <button onclick="navigate('manage', event)" class="tab-item flex flex-col items-center gap-1" id="tab-manage"><span class="text-lg">📑</span><span>Pages</span></button>
            <button onclick="navigate('convert', event)" class="tab-item flex flex-col items-center gap-1" id="tab-convert"><span class="text-lg">🔄</span><span>Tools</span></button>
        </nav>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
        let loadedPdfDoc = null;
        let selectedPageNumbers = new Set();
        let currentDrawColor = '#facc15';
        let currentTool = 'pen';
        let currentAngle = 0;

        // Crop States
        let cropStartX = 0, cropStartY = 0, cropEndX = 0, cropEndY = 0;
        let isCropping = false;

        function triggerSparkles() {
            confetti({ particleCount: 22, spread: 50, origin: { y: 0.85 }, colors: ['#38bdf8', '#818cf8', '#ffffff'] });
        }

        function navigate(tab, e) {
            document.querySelectorAll('.tab-item').forEach(b => b.classList.remove('tab-active'));
            const target = document.getElementById('tab-' + tab);
            if (target) target.classList.add('tab-active');
            if (e) triggerSparkles();

            const container = document.getElementById('screenContainer');

            if (tab === 'home') {
                container.innerHTML = `
                    <div class="grid grid-cols-2 gap-3">
                        <div onclick="navigate('crop', event)" class="glass-panel p-4 rounded-3xl border border-white/10 hover:border-blue-500/50 cursor-pointer">
                            <div class="w-10 h-10 rounded-2xl bg-rose-500/20 text-rose-400 flex items-center justify-center text-xl mb-2">✂️</div>
                            <h3 class="font-semibold text-xs">PDF Crop Studio</h3>
                            <p class="text-[10px] text-slate-400">Trim & Custom Box</p>
                        </div>
                        <div onclick="navigate('editor', event)" class="glass-panel p-4 rounded-3xl border border-white/10 hover:border-blue-500/50 cursor-pointer">
                            <div class="w-10 h-10 rounded-2xl bg-purple-500/20 text-purple-400 flex items-center justify-center text-xl mb-2">✍️</div>
                            <h3 class="font-semibold text-xs">Deep PDF Edit</h3>
                            <p class="text-[10px] text-slate-400">Text, Draw, Sign</p>
                        </div>
                        <div onclick="navigate('manage', event)" class="glass-panel p-4 rounded-3xl border border-white/10 hover:border-blue-500/50 cursor-pointer">
                            <div class="w-10 h-10 rounded-2xl bg-emerald-500/20 text-emerald-400 flex items-center justify-center text-xl mb-2">📑</div>
                            <h3 class="font-semibold text-xs">Page Picker</h3>
                            <p class="text-[10px] text-slate-400">Extract & Split</p>
                        </div>
                        <div onclick="navigate('convert', event)" class="glass-panel p-4 rounded-3xl border border-white/10 hover:border-blue-500/50 cursor-pointer">
                            <div class="w-10 h-10 rounded-2xl bg-amber-500/20 text-amber-400 flex items-center justify-center text-xl mb-2">🔄</div>
                            <h3 class="font-semibold text-xs">15+ Converters</h3>
                            <p class="text-[10px] text-slate-400">All Format Suite</p>
                        </div>
                    </div>

                    <div class="glass-panel rounded-3xl p-4 border border-white/10 space-y-2">
                        <h4 class="text-xs font-semibold text-slate-300">⚡ Fast Merge Engine</h4>
                        <input type="file" id="homeMergeFiles" multiple accept=".pdf" class="block w-full text-[10px] text-slate-400 file:mr-2 file:py-1 file:px-3 file:rounded-xl file:border-0 file:bg-blue-600 file:text-white cursor-pointer">
                        <button onclick="executeMerge()" class="glow-btn w-full py-2.5 rounded-xl text-xs font-semibold">Merge Documents</button>
                    </div>
                `;
            } else if (tab === 'crop') {
                container.innerHTML = `
                    <div class="space-y-3">
                        <div class="flex justify-between items-center">
                            <h2 class="text-sm font-semibold">PDF Crop & Trim Studio</h2>
                            <span class="text-[10px] text-rose-400 font-medium">Area Drag Selection</span>
                        </div>
                        <input type="file" id="cropFileInput" accept=".pdf" onchange="loadPdfForCrop(event)" class="text-[10px] text-slate-400 file:py-1.5 file:px-3 file:rounded-xl file:bg-rose-600 file:text-white file:border-0 cursor-pointer">
                        <p class="text-[10px] text-slate-400">Mouse ya ungli se document par drag kar ke crop box banayein:</p>
                        <div class="border border-white/15 rounded-2xl overflow-hidden bg-white flex justify-center items-center min-h-[320px] relative">
                            <canvas id="cropCanvas" class="cursor-crosshair max-w-full"></canvas>
                        </div>
                        <button onclick="saveCroppedArea()" class="glow-btn w-full py-3 rounded-2xl font-semibold text-xs">Crop & Save Area PDF</button>
                    </div>
                `;
                initCropPlaceholder();
            } else if (tab === 'editor') {
                container.innerHTML = `
                    <div class="space-y-3">
                        <div class="flex flex-wrap gap-1.5 p-2 rounded-2xl glass-panel text-[11px]">
                            <button onclick="setEditMode('pen')" class="tool-btn px-2.5 py-1 rounded-xl bg-blue-500/30 text-blue-300 border border-blue-400/30" id="btn-pen">✏️ Pen</button>
                            <button onclick="setEditMode('highlight')" class="tool-btn px-2.5 py-1 rounded-xl bg-white/5 border border-white/10" id="btn-highlight">🖍️ Highlight</button>
                            <button onclick="setEditMode('text')" class="tool-btn px-2.5 py-1 rounded-xl bg-white/5 border border-white/10" id="btn-text">✍️ Add Text</button>
                            <button onclick="setEditMode('redact')" class="tool-btn px-2.5 py-1 rounded-xl bg-white/5 border border-white/10" id="btn-redact">⬛ Redact</button>
                            <button onclick="setEditMode('sign')" class="tool-btn px-2.5 py-1 rounded-xl bg-white/5 border border-white/10" id="btn-sign">🖋️ Sign Stamp</button>
                            <button onclick="rotateCanvas()" class="tool-btn px-2.5 py-1 rounded-xl bg-white/5 border border-white/10">🔄 Rotate</button>
                            <input type="color" value="#facc15" onchange="currentDrawColor = this.value" class="w-6 h-6 rounded bg-transparent cursor-pointer ml-auto">
                        </div>
                        <input type="file" id="editorFileInput" accept=".pdf" onchange="loadEditorPdf(event)" class="text-[10px] text-slate-400 file:py-1 file:px-3 file:rounded-xl file:bg-purple-600 file:text-white file:border-0 cursor-pointer">
                        <div class="border border-white/15 rounded-2xl overflow-hidden bg-white flex justify-center items-center min-h-[300px] relative">
                            <canvas id="mainEditorCanvas" class="cursor-crosshair max-w-full"></canvas>
                        </div>
                        <button onclick="saveEditedCanvas()" class="glow-btn w-full py-3 rounded-2xl font-semibold text-xs">Save Edited PDF</button>
                    </div>
                `;
                initEditorCanvas();
            } else if (tab === 'manage') {
                container.innerHTML = `
                    <div class="space-y-3">
                        <div class="flex justify-between items-center">
                            <h2 class="text-sm font-semibold">Visual Page Picker</h2>
                            <span class="text-[11px] text-blue-400 font-medium" id="pickerCountText">0 Pages Selected</span>
                        </div>
                        <div class="p-3 glass-panel rounded-2xl border border-white/10">
                            <input type="file" id="managePdfInput" accept=".pdf" onchange="loadPdfPages(event)" class="block w-full text-[10px] text-slate-400 file:py-1.5 file:px-3 file:rounded-xl file:bg-emerald-600 file:text-white file:border-0 cursor-pointer">
                        </div>
                        <div id="pagesGrid" class="grid grid-cols-3 gap-2.5 max-h-[350px] overflow-y-auto p-1">
                            <p class="col-span-3 text-center text-slate-500 text-xs py-8">PDF upload karein taake pages samnay aayen.</p>
                        </div>
                        <button onclick="saveExtractedPages()" id="extractBtn" class="glow-btn w-full py-3 rounded-2xl font-semibold text-xs hidden">
                            Save Selected Pages as New PDF
                        </button>
                    </div>
                `;
            } else if (tab === 'convert') {
                container.innerHTML = `
                    <h2 class="text-sm font-semibold mb-1">Advanced 15+ Tools Suite</h2>
                    <p class="text-[10px] text-slate-400 mb-2">1-Click Offline Multi-Converters</p>
                    <div class="grid grid-cols-4 gap-2 mb-3">
                        ${toolTile('textToPdf', '📝', 'Text Note', 'bg-blue-500/20 text-blue-400')}
                        ${toolTile('imageToPdf', '🖼️', 'Pic->PDF', 'bg-indigo-500/20 text-indigo-400')}
                        ${toolTile('pdfToImage', '📸', 'PDF->JPG', 'bg-purple-500/20 text-purple-400')}
                        ${toolTile('watermark', '🏷️', 'Watermark', 'bg-rose-500/20 text-rose-400')}
                        ${toolTile('compress', '🗜️', 'Compress', 'bg-emerald-500/20 text-emerald-400')}
                        ${toolTile('lock', '🔒', 'Lock PDF', 'bg-red-500/20 text-red-400')}
                        ${toolTile('zip', '📦', 'To ZIP', 'bg-yellow-500/20 text-yellow-400')}
                        ${toolTile('htmlToPdf', '🌐', 'HTML->PDF', 'bg-sky-500/20 text-sky-400')}
                        ${toolTile('ocr', '🔍', 'OCR Text', 'bg-cyan-500/20 text-cyan-400')}
                        ${toolTile('splitRange', '✂️', 'Split Range', 'bg-amber-500/20 text-amber-400')}
                        ${toolTile('pageNum', '🔢', 'Add No.', 'bg-teal-500/20 text-teal-400')}
                        ${toolTile('flatten', '🛡️', 'Flatten', 'bg-violet-500/20 text-violet-400')}
                        ${toolTile('qrToPdf', '🏁', 'QR Code', 'bg-pink-500/20 text-pink-400')}
                        ${toolTile('wordSim', '📄', 'Word->PDF', 'bg-blue-600/20 text-blue-300')}
                        ${toolTile('excelSim', '📊', 'Excel->PDF', 'bg-emerald-600/20 text-emerald-300')}
                        ${toolTile('reversePdf', '🔄', 'Reverse', 'bg-orange-500/20 text-orange-400')}
                    </div>
                    <div id="toolActionArea" class="glass-panel p-3.5 rounded-2xl border border-white/10 space-y-2.5">
                        <p class="text-xs text-slate-400 text-center">Upar kisi bhi tool par tap karein.</p>
                    </div>
                `;
            }
        }

        function toolTile(id, icon, label, color) {
            return `
                <div onclick="openToolModal('${id}')" class="glass-panel p-2 rounded-2xl border border-white/10 text-center cursor-pointer hover:border-blue-400">
                    <div class="w-7 h-7 rounded-xl ${color} mx-auto flex items-center justify-center text-xs mb-1">${icon}</div>
                    <span class="text-[9px] font-medium block leading-tight">${label}</span>
                </div>
            `;
        }

        // --- CROP ENGINE ---
        function initCropPlaceholder() {
            const cvs = document.getElementById('cropCanvas');
            if (!cvs) return;
            cvs.width = 300; cvs.height = 380;
            const ctx = cvs.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 300, 380);
            ctx.fillStyle = '#64748b';
            ctx.font = '13px sans-serif';
            ctx.fillText("PDF upload karein crop karne ke liye", 20, 190);

            const getPos = (e) => {
                const rect = cvs.getBoundingClientRect();
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: clientX - rect.left, y: clientY - rect.top };
            };

            const start = (e) => {
                isCropping = true;
                const p = getPos(e);
                cropStartX = p.x; cropStartY = p.y;
            };
            const move = (e) => {
                if (!isCropping) return;
                const p = getPos(e);
                cropEndX = p.x; cropEndY = p.y;
                redrawCropOverlay();
            };
            const end = () => isCropping = false;

            cvs.onmousedown = start; cvs.onmousemove = move; cvs.onmouseup = end;
            cvs.ontouchstart = start; cvs.ontouchmove = move; cvs.ontouchend = end;
        }

        let originalCropImg = null;
        async function loadPdfForCrop(e) {
            const file = e.target.files[0];
            if (!file) return;
            const buf = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
            const page = await pdf.getPage(1);
            const viewport = page.getViewport({ scale: 1.0 });
            const cvs = document.getElementById('cropCanvas');
            cvs.width = viewport.width;
            cvs.height = viewport.height;
            await page.render({ canvasContext: cvs.getContext('2d'), viewport: viewport }).promise;
            originalCropImg = cvs.getContext('2d').getImageData(0, 0, cvs.width, cvs.height);
        }

        function redrawCropOverlay() {
            const cvs = document.getElementById('cropCanvas');
            const ctx = cvs.getContext('2d');
            if (originalCropImg) ctx.putImageData(originalCropImg, 0, 0);
            ctx.strokeStyle = '#f43f5e';
            ctx.lineWidth = 2;
            ctx.setLineDash([4, 4]);
            ctx.strokeRect(cropStartX, cropStartY, cropEndX - cropStartX, cropEndY - cropStartY);
            ctx.setLineDash([]);
        }

        function saveCroppedArea() {
            const cvs = document.getElementById('cropCanvas');
            const w = Math.abs(cropEndX - cropStartX);
            const h = Math.abs(cropEndY - cropStartY);
            if (w < 20 || h < 20) return alert('Pehle document par drag kar ke crop area select karein!');

            const cropCvs = document.createElement('canvas');
            cropCvs.width = w;
            cropCvs.height = h;
            const ctx = cropCvs.getContext('2d');
            const sx = Math.min(cropStartX, cropEndX);
            const sy = Math.min(cropStartY, cropEndY);
            ctx.drawImage(cvs, sx, sy, w, h, 0, 0, w, h);

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const pw = doc.internal.pageSize.getWidth();
            const ph = (h * pw) / w;
            doc.addImage(cropCvs.toDataURL('image/jpeg', 0.9), 'JPEG', 0, 0, pw, ph);
            doc.save('Cropped_Document.pdf');
            triggerSparkles();
        }

        // --- EDITOR ENGINE ---
        let isDrawing = false;
        function setEditMode(m) {
            currentTool = m;
            document.querySelectorAll('.tool-btn').forEach(b => {
                b.className = "tool-btn px-2.5 py-1 rounded-xl bg-white/5 border border-white/10";
            });
            const btn = document.getElementById('btn-' + m);
            if (btn) btn.className = "tool-btn px-2.5 py-1 rounded-xl bg-blue-500/30 text-blue-300 border border-blue-400/30";
        }

        function initEditorCanvas() {
            const cvs = document.getElementById('mainEditorCanvas');
            if (!cvs) return;
            cvs.width = 300; cvs.height = 380;
            const ctx = cvs.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 300, 380);
            ctx.fillStyle = '#0f172a';
            ctx.font = '13px sans-serif';
            ctx.fillText("PDF load karein ya direct edit karein", 25, 180);

            const start = (e) => { isDrawing = true; handleDraw(e); };
            const end = () => isDrawing = false;
            const move = (e) => { if (isDrawing) handleDraw(e); };

            cvs.onmousedown = start; cvs.onmouseup = end; cvs.onmousemove = move;
            cvs.ontouchstart = (e) => { isDrawing = true; handleDraw(e.touches[0]); };
            cvs.ontouchend = end;
            cvs.ontouchmove = (e) => { if (isDrawing) handleDraw(e.touches[0]); };
        }

        function handleDraw(e) {
            const cvs = document.getElementById('mainEditorCanvas');
            const ctx = cvs.getContext('2d');
            const rect = cvs.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            if (currentTool === 'highlight') {
                ctx.fillStyle = currentDrawColor + '55';
                ctx.fillRect(x - 12, y - 8, 24, 16);
            } else if (currentTool === 'pen') {
                ctx.fillStyle = currentDrawColor;
                ctx.fillRect(x - 2, y - 2, 4, 4);
            } else if (currentTool === 'redact') {
                ctx.fillStyle = '#000000';
                ctx.fillRect(x - 20, y - 10, 40, 20);
            } else if (currentTool === 'sign') {
                ctx.fillStyle = '#2563eb';
                ctx.font = 'italic bold 16px cursive';
                ctx.fillText("✓ Verified Signature", x, y);
                isDrawing = false;
            } else if (currentTool === 'text') {
                const txt = prompt("Text likhein:") || "Custom Note";
                ctx.fillStyle = currentDrawColor;
                ctx.font = '14px sans-serif';
                ctx.fillText(txt, x, y);
                isDrawing = false;
            }
        }

        async function loadEditorPdf(e) {
            const file = e.target.files[0];
            if (!file) return;
            const buf = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
            const page = await pdf.getPage(1);
            const viewport = page.getViewport({ scale: 1.0 });
            const cvs = document.getElementById('mainEditorCanvas');
            cvs.width = viewport.width;
            cvs.height = viewport.height;
            await page.render({ canvasContext: cvs.getContext('2d'), viewport: viewport }).promise;
        }

        function rotateCanvas() {
            currentAngle = (currentAngle + 90) % 360;
            const cvs = document.getElementById('mainEditorCanvas');
            cvs.style.transform = `rotate(${currentAngle}deg)`;
        }

        function saveEditedCanvas() {
            const cvs = document.getElementById('mainEditorCanvas');
            const imgData = cvs.toDataURL('image/jpeg', 0.9);
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const w = doc.internal.pageSize.getWidth();
            const h = (cvs.height * w) / cvs.width;
            doc.addImage(imgData, 'JPEG', 0, 0, w, h);
            doc.save('Edited_Document.pdf');
            triggerSparkles();
        }

        // --- PAGE PICKER ---
        async function loadPdfPages(event) {
            const file = event.target.files[0];
            if (!file) return;
            selectedPageNumbers.clear();
            const buf = await file.arrayBuffer();
            loadedPdfDoc = await pdfjsLib.getDocument({ data: buf }).promise;
            
            const grid = document.getElementById('pagesGrid');
            grid.innerHTML = '';

            for (let i = 1; i <= loadedPdfDoc.numPages; i++) {
                const page = await loadedPdfDoc.getPage(i);
                const viewport = page.getViewport({ scale: 0.3 });
                const cvs = document.createElement('canvas');
                cvs.height = viewport.height;
                cvs.width = viewport.width;
                await page.render({ canvasContext: cvs.getContext('2d'), viewport: viewport }).promise;

                const card = document.createElement('div');
                card.id = 'page-tile-' + i;
                card.className = "glass-panel p-1 rounded-2xl border border-white/10 cursor-pointer relative flex flex-col items-center hover:border-blue-400";
                card.innerHTML = `
                    <div class="w-4 h-4 rounded-full border border-white/30 absolute top-2 right-2 flex items-center justify-center text-[8px] font-bold badge"></div>
                    <span class="text-[10px] text-slate-300 mt-1">Page ${i}</span>
                `;
                cvs.className = "w-full rounded-lg";
                card.prepend(cvs);

                card.onclick = () => {
                    const badge = card.querySelector('.badge');
                    if (selectedPageNumbers.has(i)) {
                        selectedPageNumbers.delete(i);
                        card.classList.remove('border-blue-400', 'bg-blue-500/20');
                        badge.className = "w-4 h-4 rounded-full border border-white/30 absolute top-2 right-2 flex items-center justify-center text-[8px] font-bold badge";
                        badge.innerText = "";
                    } else {
                        selectedPageNumbers.add(i);
                        card.classList.add('border-blue-400', 'bg-blue-500/20');
                        badge.className = "w-4 h-4 rounded-full bg-blue-500 text-white absolute top-2 right-2 flex items-center justify-center text-[8px] font-bold badge";
                        badge.innerText = "✓";
                    }
                    document.getElementById('pickerCountText').innerText = `${selectedPageNumbers.size} Selected`;
                };
                grid.appendChild(card);
            }
            document.getElementById('extractBtn').classList.remove('hidden');
        }

        async function saveExtractedPages() {

        // --- MERGE ---
        async function executeMerge() {

            if (files.length < 2) { alert('Kam az kam 2 PDF files select karein!'); return; }

            const doc = new jsPDF();

                    cvs.height = viewport.height;

                    first = false;

                    const w = doc.internal.pageSize.getWidth();
                    const h = (cvs.height * w) / cvs.width;
                    doc.addImage(imgData, 'JPEG', 0, 0, w, h);

        // Sub-tool helpers
        function runTextToPdf() {
            const t = document.getElementById('tText').value;
            if (!t) return alert('Text likhein!');
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text(t, 15, 20, { maxWidth: 180 });
            doc.save('Notes.pdf');
            triggerSparkles();
        }

        async function runImagesToPdf() {
            const files = document.getElementById('tImages').files;
            if (files.length === 0) return alert('Images select karein!');
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            for (let i = 0; i < files.length; i++) {
                if (i > 0) doc.addPage();
                const dataUrl = await new Promise(r => {
                    const reader = new FileReader();
                    reader.onload = e => r(e.target.result);
                    reader.readAsDataURL(files[i]);
                });
                const pw = doc.internal.pageSize.getWidth();
                const ph = doc.internal.pageSize.getHeight();
                doc.addImage(dataUrl, 'JPEG', 10, 10, pw - 20, ph - 20);
            }
            doc.save('Converted_Images.pdf');
            triggerSparkles();
        }

        async function runZip() {
            const files = document.getElementById('zipFiles').files;
            if (files.length === 0) return alert('Files select karein!');
            const zip = new JSZip();
            for (let f of files) zip.file(f.name, f);

        function runHtmlToPdf() {

            if (!h) return alert('HTML code likhein!');
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.html(h, {
                callback: function (d) { d.save('Html_Converted.pdf'); triggerSparkles(); },
                x: 10, y: 10, width: 180, windowWidth: 600
            });

        async function runExtractText() {
            const f = document.getElementById('ocrPdf').files[0];
            if (!f) return alert('PDF select karein!');
            const buf = await f.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
            let fullText = "";
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const content = await page.getTextContent();
                const strings = content.items.map(item => item.str);
                fullText += `Page ${i}:\n` + strings.join(' ') + '\n\n';
            }
            const out = document.getElementById('ocrOutput');
            out.innerText = fullText || "Koi searchable text nahi mila.";
            out.classList.remove('hidden');
        }

        async function runSplitRange() {
            const f = document.getElementById('splitPdf').files[0];
            const r = document.getElementById('splitRange').value;
            if (!f || !r) return alert('PDF aur Page range likhein (e.g. 1-2)!');
            const buf = await f.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            let first = true;

            let pagesToKeep = [];
            if (r.includes('-')) {
                let [s, e] = r.split('-').map(Number);
                for (let i = s; i <= e; i++) pagesToKeep.push(i);
            } else {
                pagesToKeep = r.split(',').map(Number);
            }

            for (let p of pagesToKeep) {
                if (p > 0 && p <= pdf.numPages) {
                    const page = await pdf.getPage(p);
                    const viewport = page.getViewport({ scale: 1.5 });
                    const cvs = document.createElement('canvas');
                    cvs.height = viewport.height;
                    cvs.width = viewport.width;
                    await page.render({ canvasContext: cvs.getContext('2d'), viewport: viewport }).promise;

                    const imgData = cvs.toDataURL('image/jpeg', 0.85);
                    if (!first) doc.addPage();
                    first = false;

                    const w = doc.internal.pageSize.getWidth();
                    const h = (cvs.height * w) / cvs.width;
                    doc.addImage(imgData, 'JPEG', 0, 0, w, h);
                }
            }
            doc.save('Split_Range.pdf');
            triggerSparkles();
        }

        async function runReversePdf() {
            const f = document.getElementById('revPdf').files[0];
            if (!f) return alert('PDF select karein!');
            const buf = await f.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: buf }).promise;

            for (let i = pdf.numPages; i >= 1; i--) {
                const page = await pdf.getPage(i);

                const cvs = document.createElement('canvas');
                cvs.height = viewport.height;
                cvs.width = viewport.width;
                await page.render({ canvasContext: cvs.getContext('2d'), viewport: viewport }).promise;

                const imgData = cvs.toDataURL('image/jpeg', 0.85);

                first = false;

                const w = doc.internal.pageSize.getWidth();
                const h = (cvs.height * w) / cvs.width;
                doc.addImage(imgData, 'JPEG', 0, 0, w, h);
            }
            doc.save('Reversed_Document.pdf');
            triggerSparkles();
        }
